name: QuantOS platform CI

on:
  push:
    branches: [main]
    paths:
      - "quantos_platform/**"
      - "backend/app/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "quantos_platform/**"
      - "backend/app/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/platform-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check quantos_platform tests backend/app/ui.py

      - name: Unit tests
        # page smoke tests need the local data directory and skip themselves in CI
        run: pytest -q
