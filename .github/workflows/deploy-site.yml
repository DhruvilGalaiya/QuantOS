name: Deploy public site (GitHub Pages)

# Builds the React terminal in static mode: the Python services export every page's JSON from the newest data
# (the data-latest release written by daily-data.yml, else the data committed to the repo), the web app is built under /QuantOS/, every route gets its own HTML
# (title, description, share tags), and the result goes to GitHub Pages. No servers stay awake.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "quantos_platform/**"
      - "scripts/export_static.py"
      - "web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  workflow_call:   # daily-data.yml deploys after every refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the quant engine
        run: python -m pip install -e .
      - uses: ./.github/actions/restore-data
      - name: Export every page's data to static JSON
        run: python scripts/export_static.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app and prerender routes
        env:
          VITE_BASE: /QuantOS/
          SITE_URL: https://dhruvilgalaiya.github.io/QuantOS
        run: npm run build -w @quantos/web
      - name: Smoke-test every page in Chrome before publishing
        env:
          BASE: /QuantOS/
        run: npm run e2e -w @quantos/web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
