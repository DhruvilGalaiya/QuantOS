name: Deploy public site (GitHub Pages)

# Builds the React terminal in static mode: the Python services export every page's JSON from the committed data
# artifacts (jobs run locally, then git push), the web app is built under /QuantOS/, every route gets its own HTML
# (title, description, share tags), and the result goes to GitHub Pages. No servers stay awake.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "quantos_platform/**"
      - "scripts/export_static.py"
      - "web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the quant engine
        run: python -m pip install -e .
      - name: Export every page's data to static JSON
        run: python scripts/export_static.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app and prerender routes
        env:
          VITE_BASE: /QuantOS/
          SITE_URL: https://dhruvilgalaiya.github.io/QuantOS
        run: npm run build -w @quantos/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
