[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantos-platform"
version = "1.0.0"
description = "QuantOS: market regimes (HMM), next-session forecasting, volatility surfaces (SVI/SABR) and option strategy research for Indian indices"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "hmmlearn>=0.3",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
    "lxml>=5",
    "streamlit>=1.40",
    "plotly>=5.20",
    "arch>=7",          # GARCH in the analytics job (pages do not need it)
    "fastapi>=0.110",   # internal quant API behind the Node gateway
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
quantos-jobs = "quantos_platform.jobs:main"

[tool.setuptools.packages.find]
include = ["quantos_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the local data directory (skipped in CI when data is absent)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src", "backend/models", "backend/data", "mlops", "frontend", "QuantOS", "web", "gateway", "packages", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E731", "E741"]
